name: Generate profile summary cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate the cards
        uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: America/Costa_Rica
          THEME: radical
          AUTO_PUSH: false

      - name: Redraw the language cards with the share inside the ring
        run: python3 .github/scripts/restyle_language_cards.py profile-summary-card-output/radical

      - name: Draw the recently active card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/recent_activity_card.py profile-summary-card-output/radical/5-recently-active.svg

      - name: Draw the contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/contribution_heatmap.py profile-summary-card-output/radical/6-contributions.svg

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then echo "No changes"; else git commit -q -m "chore: update profile summary cards" && git push; fi
